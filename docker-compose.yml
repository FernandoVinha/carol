version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=1
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: minha_base
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
